<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>E02星匣</title>
<style>body{font:17px system-ui,sans-serif;margin:0;background:#f1f7f4;color:#17352a}main{max-width:960px;margin:28px auto;padding:24px}h1{font-size:28px}input,textarea,select,button{font:inherit;padding:12px;border:1px solid #a5baaf;border-radius:7px;box-sizing:border-box}textarea{width:100%;font-family:monospace;min-height:160px}input{width:min(100%,430px)}button{background:#245f49;color:white;cursor:pointer}button:disabled{opacity:.5;cursor:default}.row{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:white;border:1px solid #d0ddd5;padding:16px;min-height:40px}label{display:block;margin:15px 0 7px}small{color:#506c5f}.state{min-height:25px}h2{font-size:19px}#download{display:none}</style>
<main><h1>E02星匣</h1><p>命令在车机执行，结果直接返回此网页。切到其他应用后仍可保持连接。</p>
<label for="token">车机上显示的本次连接码</label><div class="row"><input id="token" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="输入 4 位数字"><button id="connect">验证连接</button></div><p id="connection" class="state" role="status">尚未验证</p>
<label for="mode">执行权限</label><select id="mode"><option value="normal">普通应用权限</option><option id="root-option" value="root" disabled>root（需车机本次授权）</option></select>
<label for="command">命令（支持多行，不加 adb shell 前缀）</label><textarea id="command" spellcheck="false">id</textarea>
<div class="row"><button id="run" disabled>执行并返回结果</button><button class="preset" data-command="id">身份</button><button class="preset" data-command="netstat -lnt 2&gt;&amp;1">监听端口</button><button class="preset" data-command="iptables -nvL INPUT --line-numbers 2&gt;&amp;1">入站规则</button><button class="preset" data-command="cat /proc/sys/net/ipv6/bindv6only">IPv6 配置</button><button id="download">保存结果 TXT</button></div>
<p id="result-state" class="state" role="status"></p><h2>标准输出</h2><pre id="stdout"></pre><h2>错误输出</h2><pre id="stderr"></pre>
<small>每次最多等待 30 秒；每个输出流最多保留 128 KiB。不支持交互式输入，请勿运行后台任务。普通权限不等于 ADB shell 权限。连接码仅保存在当前页面内存，关闭页面后需重新输入。</small></main>
<script>
const el=id=>document.getElementById(id);let authenticated=false,lastResult='',running=false;
function lock(){el('run').disabled=!authenticated||running;el('connect').disabled=running;el('token').disabled=running;el('mode').disabled=running;}
async function request(path,options={}){const response=await fetch(path,{...options,cache:'no-store',headers:{'X-E02-Token':el('token').value.trim(),...(options.headers||{})}});const raw=await response.text();let data;try{data=JSON.parse(raw);}catch(e){throw new Error('无法解析服务返回内容（HTTP '+response.status+'）');}if(!response.ok)throw new Error(data.error||'HTTP '+response.status);return data;}
el('token').addEventListener('input',()=>{authenticated=false;el('connection').textContent='连接码已变化，请重新验证';el('root-option').disabled=true;el('mode').value='normal';lock();});
el('connect').addEventListener('click',async()=>{running=true;lock();try{const data=await request('/api/status');authenticated=true;el('root-option').disabled=!data.rootAllowed;el('connection').textContent=data.rootAllowed?'连接成功 · 已允许本次 root 执行':'连接成功 · 仅普通应用权限';}catch(e){authenticated=false;el('connection').textContent=e.message;}finally{running=false;lock();}});
document.querySelectorAll('.preset').forEach(b=>b.addEventListener('click',()=>{el('command').value=b.dataset.command;}));
el('run').addEventListener('click',async()=>{if(running||!authenticated)return;const command=el('command').value;if(!command.trim()){el('result-state').textContent='请先输入命令';return;}running=true;lock();el('result-state').textContent='执行中…';try{const data=await request('/api/run',{method:'POST',headers:{'Content-Type':'text/plain; charset=utf-8','X-E02-Mode':el('mode').value},body:command});el('stdout').textContent=data.stdout||'';el('stderr').textContent=[data.stderr,data.error].filter(Boolean).join('\n');el('result-state').textContent='退出码 '+data.exitCode+' · '+data.durationMs+' ms'+(data.timedOut?' · 超时':'')+(data.truncated?' · 输出已截断或未结束':'');lastResult='命令：\n'+command+'\n权限：'+el('mode').value+'\n'+el('result-state').textContent+'\n\n标准输出：\n'+el('stdout').textContent+'\n\n错误输出：\n'+el('stderr').textContent;el('download').style.display='inline-block';}catch(e){el('result-state').textContent=e.message+'；请检查车机连接服务和 Wi-Fi 是否正常';}finally{running=false;lock();}});
setInterval(async()=>{if(!authenticated||running)return;const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),5000);try{await request('/api/status',{signal:controller.signal});}catch(e){authenticated=false;el('connection').textContent='连接中断，请重新验证';el('root-option').disabled=true;lock();}finally{clearTimeout(timer);}},15000);
el('download').addEventListener('click',()=>{const url=URL.createObjectURL(new Blob([lastResult],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='E02-command-result.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);});
</script></html>
