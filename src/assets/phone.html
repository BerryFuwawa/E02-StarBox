<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>E02星匣 · 手机助手</title>
<style>:root{color-scheme:dark;font:16px system-ui,sans-serif;background:#14181e;color:#e9edf3}*{box-sizing:border-box}body{margin:0 auto;max-width:680px;padding:24px 18px}h1{font-size:23px;margin:0 0 8px}h2{font-size:19px;margin:0 0 16px}.muted{color:#a8b3c4;font-size:14px;line-height:1.6}.card{background:#202630;border:1px solid #343d4a;border-radius:14px;padding:20px;margin-top:18px}button,input,textarea{font:inherit;border-radius:8px}button{border:1px solid #455266;background:#303b4b;color:#eff6ff;padding:13px 16px;min-height:48px;cursor:pointer}button.primary{background:#99c8e4;color:#17212a;border-color:#99c8e4}button:disabled{opacity:.4;cursor:wait}input,textarea{width:100%;background:#171d26;color:#edf1f7;border:1px solid #4c5a6d;padding:13px;outline:none}input:focus,textarea:focus{border-color:#99c8e4}textarea{resize:vertical;min-height:120px;line-height:1.6}#pin{font-size:26px;letter-spacing:8px;text-align:center;margin:6px 0 16px}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.row button{flex:1}#feedback{position:sticky;top:0;z-index:2;padding:12px 0;background:#14181eee;min-height:46px;color:#b7d9ed}#receive{white-space:pre-wrap;overflow-wrap:anywhere;max-height:260px;overflow:auto;user-select:text;background:#171d26;padding:14px;border-radius:8px;min-height:72px}label{display:block;margin:12px 0 8px}#target{color:#b7d9ed}#disconnect{width:100%;margin-top:20px}small{color:#9eacbf}button:focus-visible{outline:2px solid #99c8e4;outline-offset:3px}</style>
<h1>E02星匣</h1><div class="muted">手机助手 · 输入与剪贴板</div><div id="feedback" role="status" aria-live="polite">连接车机后，可发送文字和接收复制内容。</div>
<section class="card" id="pair"><h2>连接你的车机</h2><label for="pin">输入车机显示的四位连接码</label><input id="pin" type="text" inputmode="numeric" autocomplete="off" maxlength="4" pattern="[0-9]{4}"><button id="connect" class="primary" style="width:100%">连接</button><p class="muted">手机与车机需要处于可互通的局域网。连接码有效期为 10 分钟。</p></section>
<main id="app" hidden><section class="card"><h2>发送到车机</h2><div id="target">当前目标：未选择输入框</div><label for="send">输入或长按粘贴内容</label><textarea id="send" maxlength="65536" placeholder="Token、穿透密钥或配置内容"></textarea><small id="count">0 字符</small><div class="row"><button id="paste" class="primary" disabled>粘贴到焦点</button><button id="clip">发送到车机剪贴板</button></div><p class="muted">填写输入框仅支持星匣。向 EVCC 输入时，先发送到车机剪贴板，再在 EVCC 中粘贴。</p></section>
<section class="card"><h2>接收车机复制内容</h2><div class="muted" id="receivedInfo">车机复制后，内容会显示在这里。</div><pre id="receive">暂未收到内容</pre><div class="row"><button id="reveal" hidden>显示内容</button><button id="copy" disabled>复制到手机</button><button id="select" disabled>选中文本</button></div><p class="muted">一键复制不可用时，点选中文本，再长按复制。其他应用的复制回传需在星匣设置中开启。</p></section><button id="disconnect">断开连接</button></main>
<script>
const el=id=>document.getElementById(id);let session=sessionStorage.getItem('starboxSession')||'',revision=-1,received='',secret=false,revealed=false,connected=false,generation=0,targetLabel='未选择输入框';
function message(s){el('feedback').textContent=s}async function request(path,method='GET',body){const response=await fetch(path,{method,headers:{'X-Starbox-Session':session,'X-Starbox-Target':encodeURIComponent(targetLabel),...(body!==undefined?{'Content-Type':'text/plain;charset=UTF-8'}:{})},body,cache:'no-store'});const text=await response.text();let data;try{data=JSON.parse(text)}catch(e){data={error:text}}if(!response.ok){const error=Error(data.error||'操作失败');error.status=response.status;throw error}return data}
function unpair(msg){generation++;connected=false;session='';sessionStorage.removeItem('starboxSession');el('app').hidden=true;el('pair').hidden=false;received='';el('receive').textContent='暂未收到内容';el('send').value='';el('count').textContent='0 字符';message(msg)}
function showReceived(){el('receive').textContent=received?(secret&&!revealed?'敏感内容已遮罩 · 点击显示内容':received):'暂未收到内容';el('reveal').hidden=!received||!secret;el('reveal').textContent=revealed?'隐藏内容':'显示内容';el('copy').disabled=el('select').disabled=!received}
function apply(s){const changed=s.revision!==revision;revision=s.revision;const available=s.focus!=='未选择输入框';targetLabel=s.focus;el('target').textContent='当前目标：'+s.focus;el('paste').disabled=!available;if(s.clipboard!==received||s.sensitive!==secret){received=s.clipboard;secret=s.sensitive;revealed=false;showReceived();el('receivedInfo').textContent=received?'已收到 '+received.length+' 字符':'车机复制后，内容会显示在这里。'}if(changed&&s.result)message(s.result)}
async function events(myGeneration){while(connected&&myGeneration===generation){try{const s=await request('/api/events?since='+revision);if(myGeneration!==generation)return;apply(s);if(el('feedback').textContent.startsWith('连接中断'))message('已重新连接车机')}catch(e){if(myGeneration!==generation)return;if(e.status===401){unpair('连接已失效，请输入新的连接码');return}message('连接中断，正在重连；请确认仍在同一网络。');await new Promise(r=>setTimeout(r,3000))}}}
function activate(){connected=true;revision=-1;el('pair').hidden=true;el('app').hidden=false;message('已连接 · 在车机点选输入框即可填写');events(++generation)}
el('connect').onclick=async()=>{const pin=el('pin').value;if(!/^\d{4}$/.test(pin)){message('请输入四位数字连接码');return}el('connect').disabled=true;try{const s=await request('/api/pair','POST',pin);session=s.session;sessionStorage.setItem('starboxSession',session);el('pin').value='';activate()}catch(e){message(e.message)}finally{el('connect').disabled=false}};
el('send').oninput=()=>el('count').textContent=el('send').value.length+' 字符';for(const [id,path]of[['paste','/api/focus'],['clip','/api/clipboard']])el(id).onclick=async()=>{const b=el(id);b.disabled=true;try{const s=await request(path,'POST',el('send').value);message(s.message)}catch(e){if(e.status===401)unpair('连接已失效，请重新连接');else message(e.message)}finally{if(id==='clip')b.disabled=false;else b.disabled=el('target').textContent.includes('未选择输入框');}};
el('reveal').onclick=()=>{revealed=!revealed;showReceived()};function selectText(){revealed=true;showReceived();const range=document.createRange();range.selectNodeContents(el('receive'));const selection=window.getSelection();selection.removeAllRanges();selection.addRange(range)}el('select').onclick=()=>{selectText();message('已选中文本，请长按复制')};
el('copy').onclick=async()=>{try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(received);message('已复制到手机');return}selectText();if(document.execCommand('copy'))message('已复制到手机');else message('请长按选中的文字，选择复制')}catch(e){selectText();message('请长按选中的文字，选择复制')}};
el('disconnect').onclick=async()=>{try{await request('/api/disconnect','POST','')}catch(e){}unpair('已断开连接')};if(session)activate();
</script></html>
